name: fuzz

# libFuzzer runs of the core parsers (ADR 0010). A pull request gets a short budget per target;
# the weekly schedule and a manual run get a long one. ci.yml is unchanged.
on:
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-19 clang-tidy-19
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: fuzz
      - name: Fuzz
        env:
          CC: clang-19
          CXX: clang++-19
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '60' || '600' }}
        run: scripts/fuzz.sh "$FUZZ_SECONDS"
      - name: Static analysis of the fuzz targets
        run: CLANG_TIDY=clang-tidy-19 scripts/tidy.sh build/fuzz
      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: build/fuzz/artifacts/
          if-no-files-found: ignore
