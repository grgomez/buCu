name: ci

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-gcc-13-debug
            os: ubuntu-24.04
            preset: debug
            cc: gcc-13
            cxx: g++-13
          - name: ubuntu-gcc-13-release
            os: ubuntu-24.04
            preset: release
            cc: gcc-13
            cxx: g++-13
          - name: ubuntu-clang-19-debug
            os: ubuntu-24.04
            preset: debug
            cc: clang-19
            cxx: clang++-19
            install: clang-19
          - name: ubuntu-clang-19-release
            os: ubuntu-24.04
            preset: release
            cc: clang-19
            cxx: clang++-19
            install: clang-19
          - name: macos-15-apple-clang-debug
            os: macos-15
            preset: debug
            cc: clang
            cxx: clang++
          - name: windows-msvc-debug
            os: windows-latest
            preset: debug
            cc: cl
            cxx: cl
            extra: -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          - name: ubuntu-clang-19-asan-ubsan
            os: ubuntu-24.04
            preset: asan-ubsan
            cc: clang-19
            cxx: clang++-19
            install: clang-19 libclang-rt-19-dev
    steps:
      - uses: actions/checkout@v4
      - name: Install tools (Ubuntu)
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        with:
          packages: ninja-build ${{ matrix.install }}
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.name }}
      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ${{ matrix.extra }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  format:
    name: format
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: scripts/format.sh --check

  tidy:
    name: tidy
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        uses: ./.github/actions/apt-install
        with:
          packages: ninja-build clang-19 clang-tidy-19
      - name: Configure
        run: >
          cmake --preset debug
          -DCMAKE_C_COMPILER=clang-19
          -DCMAKE_CXX_COMPILER=clang++-19
      - name: Build
        run: cmake --build --preset debug
      - name: Static analysis
        run: CLANG_TIDY=clang-tidy-19 scripts/tidy.sh build/debug

  coverage:
    name: coverage
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        uses: ./.github/actions/apt-install
        with:
          packages: ninja-build clang-19 llvm-19 libclang-rt-19-dev
      - name: Install lizard
        run: pipx install lizard==1.26.1
      - name: Test the report scripts
        run: python3 -m unittest discover -s scripts/tests
      - name: Configure
        run: >
          cmake --preset coverage
          -DCMAKE_C_COMPILER=clang-19
          -DCMAKE_CXX_COMPILER=clang++-19
      - name: Build
        run: cmake --build --preset coverage
      - name: Test
        run: ctest --preset coverage
      - name: Report
        run: LLVM_COV=llvm-cov-19 LLVM_PROFDATA=llvm-profdata-19 scripts/coverage.sh build/coverage
      - name: Job summary
        run: |
          {
            echo "## Coverage (informational, no threshold)"
            echo
            echo "Columns: regions, functions, lines, branches; each with misses and a percentage."
            echo
            echo '```text'
            grep -E '^(Filename|TOTAL)' build/coverage/report/coverage.txt
            echo '```'
            echo
            echo "## Highest CRAP scores"
            echo
            grep '^|' build/coverage/report/crap.md | head -22
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build/coverage/report/coverage.txt
            build/coverage/report/coverage.lcov
            build/coverage/report/crap.md
            build/coverage/report/html
